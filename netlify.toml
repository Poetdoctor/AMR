[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Decap CMS is its own built page, not an SPA route. Netlify serves existing
# files (including /admin/config.yml) before applying redirects, so this only
# catches the bare path and any client-side sub-paths.
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Client-side routing: every other path serves the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
